# Local development override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  qubo-admin:
    build:
      target: deps
    command: ["pnpm", "--filter", "qubo-admin", "dev"]
    volumes:
      - ./apps/qubo-admin:/app/apps/qubo-admin
      - ./packages:/app/packages
      - /app/apps/qubo-admin/node_modules
      - /app/apps/qubo-admin/.next
    ports:
      - "4000:4000"

  qubo-storefront:
    profiles:
      - production
