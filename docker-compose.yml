name: peltier

services:
  peltier-postgres:
    image: postgres:17-alpine
    container_name: peltier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peltier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peltier_secret}
      POSTGRES_DB: ${POSTGRES_DB:-peltier}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - peltier-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-peltier} -d ${POSTGRES_DB:-peltier}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  peltier-elysia:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: peltier-elysia
    restart: unless-stopped
    expose:
      - "3333"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-peltier}:${POSTGRES_PASSWORD:-peltier_secret}@peltier-postgres:5432/${POSTGRES_DB:-peltier}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - PELTIER_TRUSTED_ORIGINS=${PELTIER_TRUSTED_ORIGINS:-https://admin.peltier.be,https://hmfroid.be}
      - PORT=3333
    depends_on:
      peltier-postgres:
        condition: service_healthy
    networks:
      - peltier-network

  peltier-admin:
    build:
      context: .
      dockerfile: apps/peltier-admin/Dockerfile
    container_name: peltier-admin
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-peltier}:${POSTGRES_PASSWORD:-peltier_secret}@peltier-postgres:5432/${POSTGRES_DB:-peltier}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://admin.peltier.be
      - NEXT_PUBLIC_PANEL_URL=https://admin.peltier.be
      - PELTIER_API_URL=http://peltier-elysia:3333
    depends_on:
      peltier-postgres:
        condition: service_healthy
      peltier-elysia:
        condition: service_started
    networks:
      - peltier-network

  hm-froid:
    build:
      context: .
      dockerfile: apps/hm-froid/Dockerfile
    container_name: hm-froid
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-peltier}:${POSTGRES_PASSWORD:-peltier_secret}@peltier-postgres:5432/${POSTGRES_DB:-peltier}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://hmfroid.be
      - NEXT_PUBLIC_PANEL_URL=https://admin.peltier.be
      - NEXT_PUBLIC_MARKETING_URL=https://hmfroid.be
      - STOREFRONT_URL=https://hmfroid.be
      - STOREFRONT_SITE_SLUG=hm-froid
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - HMF_SHIPPING_RATE_CENTS=${HMF_SHIPPING_RATE_CENTS:-0}
      - HMF_SHIPPING_LABEL=${HMF_SHIPPING_LABEL:-Livraison professionnelle}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ORDER_EMAIL_FROM=${ORDER_EMAIL_FROM:-HM Froid <commandes@hmfroid.be>}
      - PELTIER_API_URL=http://peltier-elysia:3333
      - LEGACY_ASSET_ROOT=/data/legacy-products
    volumes:
      - ${LEGACY_ASSET_HOST_PATH:-./.private/legacy-archive/2026-09-18/assets/products}:/data/legacy-products:ro
    depends_on:
      peltier-postgres:
        condition: service_healthy
    networks:
      - peltier-network

  caddy-edge:
    image: caddy:2-alpine
    container_name: caddy-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - peltier-network
    depends_on:
      - peltier-admin
      - hm-froid

networks:
  peltier-network:
    name: peltier-network

volumes:
  pgdata:
  caddy_data:
  caddy_config:
