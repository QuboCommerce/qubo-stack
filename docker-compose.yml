name: qubo

services:
  qubo-postgres:
    image: postgres:17-alpine
    container_name: qubo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qubo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qubo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-qubo}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - qubo-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-qubo} -d ${POSTGRES_DB:-qubo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  qubo-elysia:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: qubo-elysia
    restart: unless-stopped
    expose:
      - "3333"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qubo}:${POSTGRES_PASSWORD:-qubo_secret}@qubo-postgres:5432/${POSTGRES_DB:-qubo}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - QUBO_TRUSTED_ORIGINS=${QUBO_TRUSTED_ORIGINS:-https://qubo.by-ali.dev,https://hmfroid.be}
      - PORT=3333
    depends_on:
      qubo-postgres:
        condition: service_healthy
    networks:
      - qubo-network

  qubo-admin:
    build:
      context: .
      dockerfile: apps/qubo-admin/Dockerfile
    container_name: qubo-admin
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qubo}:${POSTGRES_PASSWORD:-qubo_secret}@qubo-postgres:5432/${POSTGRES_DB:-qubo}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://qubo.by-ali.dev
      - NEXT_PUBLIC_PANEL_URL=https://qubo.by-ali.dev
      - QUBO_API_URL=http://qubo-elysia:3333
    depends_on:
      qubo-postgres:
        condition: service_healthy
      qubo-elysia:
        condition: service_started
    networks:
      - qubo-network

  hm-froid:
    build:
      context: .
      dockerfile: apps/hm-froid/Dockerfile
    container_name: hm-froid
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qubo}:${POSTGRES_PASSWORD:-qubo_secret}@qubo-postgres:5432/${POSTGRES_DB:-qubo}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://hmfroid.be
      - NEXT_PUBLIC_PANEL_URL=https://qubo.by-ali.dev
      - NEXT_PUBLIC_MARKETING_URL=https://hmfroid.be
      - STOREFRONT_URL=https://hmfroid.be
      - STOREFRONT_SITE_SLUG=hm-froid
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - HMF_SHIPPING_RATE_CENTS=${HMF_SHIPPING_RATE_CENTS:-0}
      - HMF_SHIPPING_LABEL=${HMF_SHIPPING_LABEL:-Livraison professionnelle}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ORDER_EMAIL_FROM=${ORDER_EMAIL_FROM:-HM Froid <commandes@hmfroid.be>}
      - QUBO_API_URL=http://qubo-elysia:3333
      - LEGACY_ASSET_ROOT=/data/legacy-products
    volumes:
      - ${LEGACY_ASSET_HOST_PATH:-./.private/legacy-archive/2026-09-18/assets/products}:/data/legacy-products:ro
    depends_on:
      qubo-postgres:
        condition: service_healthy
    networks:
      - qubo-network

  caddy-edge:
    image: caddy:2-alpine
    container_name: caddy-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - qubo-network
    depends_on:
      - qubo-admin
      - hm-froid

networks:
  qubo-network:
    name: qubo-network

volumes:
  pgdata:
  caddy_data:
  caddy_config:
